name: Build SM-R920 ReSukiSU AP

on:
  workflow_dispatch:
    inputs:
      resukisu_setup_url:
        description: "ReSukiSU setup.sh URL"
        required: true
        default: "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh"
      source_release_tag:
        description: "Release tag containing Kernel.tar.gz and R920-model Kernel tarball"
        required: true
        default: "source-tarballs"
      firmware_release_tag:
        description: "Release tag containing boot.img(.lz4) and vbmeta.img(.lz4) for R920XXS2DZE1. NOTE: SM-R920 has NO init_boot partition."
        required: true
        default: "firmware-r920-dze1"

permissions:
  contents: write

jobs:
  build:
    name: Build SM-R920 ReSukiSU AP
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Samsung source tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p source

          gh release download "${{ github.event.inputs.source_release_tag }}" \
            --repo "${{ github.repository }}" \
            --dir source \
            --pattern "*.tar.gz"

          echo "===== SOURCE FILES ====="
          ls -lh source

          test -f source/Kernel.tar.gz
          ls source/R920*.tar.gz

      - name: Download stock R920XXS2DZE1 firmware images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p firmware

          gh release download "${{ github.event.inputs.firmware_release_tag }}" \
            --repo "${{ github.repository }}" \
            --dir firmware \
            --pattern "boot.img*" \
            --pattern "vbmeta.img*"

          echo "===== FIRMWARE FILES ====="
          ls -lh firmware

      - name: Install dependencies
        run: |
          set -e
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 perl git unzip zip tar lz4 xz-utils zstd \
            clang-14 lld-14 llvm-14 rsync cpio kmod dwarves patch file curl \
            openssl \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Set clang 14 path
        run: |
          set -e
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"
          /usr/lib/llvm-14/bin/clang --version
          /usr/lib/llvm-14/bin/ld.lld --version

      - name: Extract Samsung kernel source
        run: |
          set -e

          mkdir -p work/kernel

          tar -xzf source/Kernel.tar.gz -C work/kernel
          for t in source/R920*.tar.gz; do tar -xzf "$t" -C work/kernel --strip-components=1; done

          # Samsung source tarballs can preserve read-only modes.
          # Make the tree writable before ReSukiSU/manual patches edit files.
          chmod -R u+rwX work/kernel

          echo "===== CHECK DEFCONFIG ====="
          find work/kernel/arch/arm64/configs -type f | sort
          echo "--- s5e5515/projectx candidates ---"
          find work/kernel/arch/arm64/configs -type f | grep -Ei "projectx|s5e5515" || true

          echo "===== SOURCE TOP LEVEL ====="
          ls -la work/kernel | head -50

      - name: Add ReSukiSU
        run: |
          set -e

          cd work/kernel

          echo "===== ADDING ReSukiSU ====="
          curl -LSs "${{ github.event.inputs.resukisu_setup_url }}" | bash -

          # Make sure setup-added and source files are writable for manual hook patching.
          chmod -R u+rwX .

          echo "===== ReSukiSU FILE CHECK ====="
          find . -maxdepth 5 \( -iname "*resukisu*" -o -iname "*kernelsu*" -o -iname "*ksu*" \) | head -150

      - name: Apply ReSukiSU documented manual hooks
        run: |
          set -e

          cd work/kernel
          chmod -R u+rwX .

          cat > apply_resukisu_manual_hooks.py <<'PY'
          import re
          import stat
          from pathlib import Path

          def read(path):
              p = Path(path)
              if not p.exists():
                  return None
              return p.read_text(errors="ignore")

          def make_writable(path):
              p = Path(path)
              try:
                  p.chmod(p.stat().st_mode | stat.S_IWUSR | stat.S_IRUSR)
              except Exception as e:
                  print(f"WARN could not chmod {path}: {e}")

          def write(path, data):
              make_writable(path)
              Path(path).write_text(data)

          def insert_before_literal(path, needle, block, tag, required=True):
              s = read(path)
              if s is None:
                  msg = f"missing file: {path}"
                  if required:
                      raise SystemExit(msg)
                  print("optional skip:", msg)
                  return False

              if tag in s:
                  print(f"already patched: {path} [{tag}]")
                  return True

              if needle not in s:
                  msg = f"marker not found in {path}: {needle!r}"
                  if required:
                      raise SystemExit(msg)
                  print("optional skip:", msg)
                  return False

              write(path, s.replace(needle, block + needle, 1))
              print(f"patched: {path} [{tag}]")
              return True

          def replace_literal(path, old, new, tag, required=True):
              s = read(path)
              if s is None:
                  msg = f"missing file: {path}"
                  if required:
                      raise SystemExit(msg)
                  print("optional skip:", msg)
                  return False

              if tag in s:
                  print(f"already patched: {path} [{tag}]")
                  return True

              if old not in s:
                  msg = f"marker not found in {path}: {old[:120]!r}"
                  if required:
                      raise SystemExit(msg)
                  print("optional skip:", msg)
                  return False

              write(path, s.replace(old, new, 1))
              print(f"patched: {path} [{tag}]")
              return True

          def re_patch(path, pattern, repl, tag, required=True, flags=re.S):
              s = read(path)
              if s is None:
                  msg = f"missing file: {path}"
                  if required:
                      raise SystemExit(msg)
                  print("optional skip:", msg)
                  return False

              if tag in s:
                  print(f"already patched: {path} [{tag}]")
                  return True

              new, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n == 0:
                  msg = f"regex marker not found in {path}: {pattern[:120]!r}"
                  if required:
                      raise SystemExit(msg)
                  print("optional skip:", msg)
                  return False

              write(path, new)
              print(f"patched: {path} [{tag}]")
              return True

          # Required documented manual hooks: stat, execve/execveat, faccessat, reboot.

          insert_before_literal(
              "fs/stat.c",
              "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)",
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          /* ReSukiSU manual hook: stat externs */
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
                                     int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd,
                                              struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(unsigned long *fd,
                                             struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          ''',
              "ReSukiSU manual hook: stat externs",
              required=True,
          )

          re_patch(
              "fs/stat.c",
              r'(\n\s*int error;\n\n)(\s*error = vfs_fstatat\(dfd, filename, &stat, flag\);)',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: stat path */\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\2',
              "ReSukiSU manual hook: stat path",
              required=True,
          )

          re_patch(
              "fs/stat.c",
              r'(\n\s*if \(!error\)\n\s*error = cp_new_stat\(&stat, statbuf\);\n\n)(\s*return error;)',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: newfstat ret */\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n\2',
              "ReSukiSU manual hook: newfstat ret",
              required=False,
          )

          # NOTE:
          # Do NOT blindly inject ksu_handle_fstat64_ret() here.
          # Samsung's fs/stat.c has cp_new_stat64() paths where the syscall
          # variable is dfd, not fd, which caused:
          #   fs/stat.c: error: use of undeclared identifier 'fd'
          # The core required stat hook above is kept; fstat64-ret is skipped
          # unless you hand-patch the exact SYSCALL_DEFINE2(fstat64) body.

          re_patch(
              "fs/exec.c",
              r'(static int do_execve\(struct filename \*filename,)',
              r'#ifdef CONFIG_KSU_MANUAL_HOOK\n/* ReSukiSU manual hook: execveat extern */\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n                               void *argv, void *envp, int *flags);\n#endif\n\n\1',
              "ReSukiSU manual hook: execveat extern",
              required=True,
          )

          re_patch(
              "fs/exec.c",
              r'(\n\s*struct user_arg_ptr argv = \{ \.ptr\.native = __argv \};\n\s*struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};\n)(\s*return do_execveat_common\(AT_FDCWD, filename, argv, envp, 0\);)',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: do_execve */\n\tint ksu_fd = AT_FDCWD;\n\tint ksu_flags = 0;\n\tksu_handle_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags);\n\treturn do_execveat_common(ksu_fd, filename, argv, envp, ksu_flags);\n#endif\n\2',
              "ReSukiSU manual hook: do_execve",
              required=True,
          )

          re_patch(
              "fs/exec.c",
              r'(\n\s*struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};\n\n)(\s*return do_execveat_common\(fd, filename, argv, envp, flags\);)',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: do_execveat */\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\2',
              "ReSukiSU manual hook: do_execveat",
              required=True,
          )

          re_patch(
              "fs/exec.c",
              r'(\n\s*struct user_arg_ptr envp = \{\n\s*\.is_compat = true,\n\s*\.ptr\.compat = __envp,\n\s*\};\n)(\s*return do_execveat_common\(AT_FDCWD, filename, argv, envp, 0\);)',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: compat_do_execve */\n\tint ksu_fd = AT_FDCWD;\n\tint ksu_flags = 0;\n\tksu_handle_execveat(&ksu_fd, &filename, &argv, &envp, &ksu_flags);\n\treturn do_execveat_common(ksu_fd, filename, argv, envp, ksu_flags);\n#endif\n\2',
              "ReSukiSU manual hook: compat_do_execve",
              required=False,
          )

          re_patch(
              "fs/exec.c",
              r'(\n\s*struct user_arg_ptr envp = \{\n\s*\.is_compat = true,\n\s*\.ptr\.compat = __envp,\n\s*\};\n\n)(\s*return do_execveat_common\(fd, filename, argv, envp, flags\);)',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: compat_do_execveat */\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n\2',
              "ReSukiSU manual hook: compat_do_execveat",
              required=False,
          )

          insert_before_literal(
              "fs/open.c",
              "static long do_faccessat(int dfd, const char __user *filename, int mode, int flags)",
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          /* ReSukiSU manual hook: faccessat extern */
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
                                          int *mode, int *flags);
          #endif

          ''',
              "ReSukiSU manual hook: faccessat extern",
              required=True,
          )

          re_patch(
              "fs/open.c",
              r'(\n\s*const struct cred \*old_cred = NULL;\n\n)(\s*if \(mode & ~S_IRWXO\))',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: do_faccessat */\n\tksu_handle_faccessat(&dfd, &filename, &mode, &flags);\n#endif\n\2',
              "ReSukiSU manual hook: do_faccessat",
              required=True,
          )

          insert_before_literal(
              "kernel/reboot.c",
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,",
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          /* ReSukiSU manual hook: reboot extern */
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,
                                           void __user **arg);
          #endif

          ''',
              "ReSukiSU manual hook: reboot extern",
              required=True,
          )

          re_patch(
              "kernel/reboot.c",
              r'(\n\s*char buffer\[256\];\n\s*int ret = 0;\n\n)(\s*/\* We only trust the superuser with rebooting the system\. \*/)',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: sys_reboot */\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\2',
              "ReSukiSU manual hook: sys_reboot",
              required=True,
          )

          # Optional documented/related hooks. Best-effort only.

          insert_before_literal(
              "drivers/input/input.c",
              "void input_event(struct input_dev *dev,",
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          /* ReSukiSU manual hook: input externs */
          extern bool ksu_input_hook __read_mostly;
          extern int ksu_handle_input_handle_event(unsigned int *type,
                                                   unsigned int *code, int *value);
          #endif

          ''',
              "ReSukiSU manual hook: input externs",
              required=False,
          )

          re_patch(
              "drivers/input/input.c",
              r'(void input_event\(struct input_dev \*dev,.*?\{\n\s*unsigned long flags;\n\n)',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: input_event */\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n#endif\n',
              "ReSukiSU manual hook: input_event",
              required=False,
          )

          insert_before_literal(
              "kernel/sys.c",
              "long __sys_setresuid(uid_t ruid, uid_t euid, uid_t suid)",
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          /* ReSukiSU manual hook: setresuid extern */
          extern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);
          #endif

          ''',
              "ReSukiSU manual hook: setresuid extern",
              required=False,
          )

          re_patch(
              "kernel/sys.c",
              r'(long __sys_setresuid\(uid_t ruid, uid_t euid, uid_t suid\)\n\{.*?kuid_t kruid, keuid, ksuid;\n\s*bool ruid_new, euid_new, suid_new;\n\n)',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: __sys_setresuid */\n\t(void)ksu_handle_setresuid(ruid, euid, suid);\n#endif\n',
              "ReSukiSU manual hook: __sys_setresuid",
              required=False,
          )

          insert_before_literal(
              "fs/read_write.c",
              "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)",
              '''#ifdef CONFIG_KSU_MANUAL_HOOK
          /* ReSukiSU manual hook: sys_read externs */
          extern bool ksu_init_rc_hook __read_mostly;
          extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,
                          char __user **buf_ptr, size_t *count_ptr);
          #endif

          ''',
              "ReSukiSU manual hook: sys_read externs",
              required=False,
          )

          re_patch(
              "fs/read_write.c",
              r'(SYSCALL_DEFINE3\(read, unsigned int, fd, char __user \*, buf, size_t, count\)\n\{\n)\s*return ksys_read\(fd, buf, count\);',
              r'\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\t/* ReSukiSU manual hook: sys_read body */\n\tif (unlikely(ksu_init_rc_hook))\n\t\tksu_handle_sys_read(fd, &buf, &count);\n#endif\n\treturn ksys_read(fd, buf, count);',
              "ReSukiSU manual hook: sys_read body",
              required=False,
          )

          # Optional SELinux exports.
          replace_literal(
              "security/selinux/ss/services.c",
              "static DEFINE_RWLOCK(policy_rwlock);",
              "DEFINE_RWLOCK(policy_rwlock); /* ReSukiSU optional: policy_rwlock export */",
              "ReSukiSU optional: policy_rwlock export",
              required=False,
          )

          replace_literal(
              "security/selinux/hooks.c",
              "static struct security_operations selinux_ops",
              "struct security_operations selinux_ops /* ReSukiSU optional: selinux_ops export */",
              "ReSukiSU optional: selinux_ops export",
              required=False,
          )

          replace_literal(
              "security/selinux/selinuxfs.c",
              "static DEFINE_MUTEX(sel_mutex);",
              "DEFINE_MUTEX(sel_mutex); /* ReSukiSU optional: sel_mutex export */",
              "ReSukiSU optional: sel_mutex export",
              required=False,
          )

          print("ReSukiSU documented manual integration patcher finished.")
          PY

          python3 apply_resukisu_manual_hooks.py

          echo "===== Verify manual hook symbols ====="
          grep -R "ksu_handle_stat\|ksu_handle_newfstat_ret\|ksu_handle_fstat64_ret\|ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_sys_reboot\|ksu_handle_setresuid\|ksu_handle_sys_read\|ksu_handle_input_handle_event" \
            fs/stat.c fs/exec.c fs/open.c kernel/reboot.c kernel/sys.c fs/read_write.c drivers/input/input.c || true

      - name: Build ReSukiSU kernel (SM-R920)
        run: |
          set -e

          cd work/kernel

          export PLATFORM_VERSION=16
          export TARGET_SOC=s5e5515
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=dpi
          export KBUILD_BUILD_HOST=VPHORC629
          export PATH="/usr/lib/llvm-14/bin:$PATH"

          # Export para o BakaSU: com KALLSYMS_ALL off, o static_export_check
          # exige sel_handle_status_ops exportado (build 40055205764 travou
          # sem ele). Base vem do tarball R905USQU1DYL6
          # (security/selinux/selinuxfs.c:272); incrementais nao tocam nele.
                    # Exports para o BakaSU: com KALLSYMS_ALL off, o static_export_check
          # exige estes 3 simbolos nao-static (builds 40055205764 e 40057157293
          # travaram em cada um). Lista completa em
          # BakaSU/kernel/tools/static_export_check.mk. Base vem do tarball
          # R905USQU1DYL6; incrementais nao tocam nesses arquivos.
          cat > export_bakasu_syms.py <<'PY'
          from pathlib import Path


          def unstatic_export(rel, sig_start, sym):
              p = Path(rel)
              src = p.read_text(errors="ignore")
              n = src.count(sig_start)
              assert n >= 1, f"assinatura nao achada em {rel}: {sig_start[:60]!r}"
              src = src.replace(sig_start, sig_start.replace("static ", "", 1))
              # fim da definicao: primeira linha "}" na coluna 0 apos a ULTIMA ocorrencia
              idx = src.rfind(sig_start.replace("static ", "", 1))
              end = src.find("\n}\n", idx)
              assert end != -1, f"fim da funcao nao achado em {rel} para {sym}"
              tag = f"EXPORT_SYMBOL_GPL({sym});"
              if tag not in src:
                  src = src[:end + 3] + tag + "\n" + src[end + 3:]
              p.write_text(src)
              # prova que o check do BakaSU (grep -F) passa
              assert sig_start not in p.read_text(errors="ignore"), f"check falharia em {rel}"
              print(f"{sym} exportado em {rel}")


          def ensure_include(rel, anchor, inc):
              p = Path(rel)
              src = p.read_text(errors="ignore")
              assert anchor in src, f"anchor nao achado em {rel}"
              if inc not in src:
                  src = src.replace(anchor, anchor + "\n" + inc, 1)
                  p.write_text(src)


          SFS = "security/selinux/selinuxfs.c"
          SVC = "security/selinux/ss/services.c"
          EXP = "#include <linux/export.h>"

          ensure_include(SFS, "#include <linux/ctype.h>", EXP)
          unstatic_export(SFS,
                          "static const struct file_operations sel_handle_status_ops = {",
                          "sel_handle_status_ops")

          ensure_include(SVC, "#include <trace/hooks/selinux.h>", EXP)
          unstatic_export(SVC,
                          "static void security_dump_masked_av(struct policydb *policydb,",
                          "security_dump_masked_av")
          unstatic_export(SVC,
                          "static void context_struct_compute_av(struct policydb *policydb,",
                          "context_struct_compute_av")
          print("exports BakaSU ok")
          PY
          python3 export_bakasu_syms.py
          grep -n "sel_handle_status_ops\|security_dump_masked_av\|context_struct_compute_av\|EXPORT_SYMBOL_GPL" security/selinux/selinuxfs.c security/selinux/ss/services.c


          # DEFCONFIG candidato NAO confirmado: o nome abaixo segue o padrao do
          # R960 (wise6blue -> projectxblue) e PODE NAO EXISTIR no fonte real
          # do R920. So use o defconfig achado com find no fonte do Passo 4.
          # A trava abaixo impede build com defconfig errado.
          DEFCONFIG="${DEFCONFIG:-s5e5515-projectxblue_defconfig}"
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "DEFCONFIG $DEFCONFIG nao encontrado no fonte extraido."
            echo "Rode: find work/kernel/arch/arm64/configs -type f | sort"
            echo "e informe o DEFCONFIG real do R920 (variavel DEFCONFIG ou edite o workflow). Nao use defconfig do R960."
            exit 1
          fi
          make O=out_resukisu "$DEFCONFIG"

          printf "" > .scmversion

          ./scripts/config --file out_resukisu/.config --set-str LOCALVERSION "-ReSukiSU-33003255-abR920XXS2DZE1" || true
          ./scripts/config --file out_resukisu/.config -d LOCALVERSION_AUTO || true

          # Disable Samsung/custom-kernel blockers if present.
          ./scripts/config --file out_resukisu/.config -d MODULE_SIG_PROTECT || true
          ./scripts/config --file out_resukisu/.config -d UH || true
          ./scripts/config --file out_resukisu/.config -d RKP || true
          ./scripts/config --file out_resukisu/.config -d KDP || true
          ./scripts/config --file out_resukisu/.config -d SECURITY_DEFEX || true
          ./scripts/config --file out_resukisu/.config -d SVSMC || true
          ./scripts/config --file out_resukisu/.config -d SAMSUNG_PRODUCT_SHIP || true

          # ReSukiSU documented build options.
          ./scripts/config --file out_resukisu/.config -e KSU || true
          ./scripts/config --file out_resukisu/.config -e KERNELSU || true
          ./scripts/config --file out_resukisu/.config -e RESUKISU || true
          ./scripts/config --file out_resukisu/.config -e KSU_MANUAL_HOOK || true
          ./scripts/config --file out_resukisu/.config -e KSU_MULTI_MANAGER_SUPPORT || true
          ./scripts/config --file out_resukisu/.config -e MULTI_MANAGER_SUPPORT || true

          # Slim the Image: R920 boot partition is 37748736 bytes with a
          # ~9 MB ramdisk + 1660 dtb, so the kernel must stay under ~28 MB.
          ./scripts/config --file out_resukisu/.config -d DEBUG_INFO || true
          ./scripts/config --file out_resukisu/.config -d DEBUG_INFO_BTF || true
          ./scripts/config --file out_resukisu/.config -d DEBUG_INFO_DWARF5 || true
          ./scripts/config --file out_resukisu/.config -d DEBUG_INFO_SPLIT || true

                              # Dieta round 4 (build 40061265073: 29632520 > budget 28516000;
          # faltam 1.1 MB; nm mostra gordura distribuida, sem um culpado so.
          # Remove (tudo =y no defconfig, nada no caminho de boot/root/radio/
          # display/audio/sensor; radios USB/BT/WLAN/NFC intocados): KFENCE,
          # SLUB_DEBUG, PM_DEBUG, governadores sobrando
          # (SCHED_DEBUG/STATS ficam: o EMS da Samsung usa sched_feat_*;
          # build 40063494991 provou)
          # (cpufreq PERFORMANCE/POWERSAVE/CONSERVATIVE, cpuidle MENU/HALO;
          # ficam SCHEDUTIL+ENERGYAWARE e TEO), USB_STORAGE (host; gadget fica),
          # PRINTK_CALLER, IO_URING, TIPC,
          # (NFC fica: o driver nxp_combined quebra sem o logger; sem ganho)
          # L2TP, PHONET, IEEE802154/6LOWPAN, WIREGUARD, MACSEC. UPROBES e
          # NET_SOCK_MSG a arvore religa sozinha (select); manter no -d nao
          # faz mal. Resto dos rounds 1-3 mantido.
          for sym in KASAN KASAN_HW_TAGS KASAN_VMALLOC KASAN_SW_TAGS \
            KASAN_GENERIC UBSAN UBSAN_SANITIZE_ALL UBSAN_BOUNDS \
            UBSAN_ARRAY_BOUNDS UBSAN_LOCAL_BOUNDS KPROBES \
            EXYNOS_DEBUG_INFO IKCONFIG IKCONFIG_PROC \
            VIRTUALIZATION KVM DEBUG_KERNEL HIBERNATION \
            HIBERNATION_SNAPSHOT_DEV UPROBES XDP_SOCKETS NET_CLS_BPF \
            NET_SOCK_MSG KFENCE SLUB_DEBUG \
            PM_DEBUG CPU_FREQ_GOV_PERFORMANCE CPU_FREQ_GOV_POWERSAVE \
            CPU_FREQ_GOV_CONSERVATIVE CPU_IDLE_GOV_MENU CPU_IDLE_GOV_HALO \
            USB_STORAGE PRINTK_CALLER \
            IO_URING TIPC L2TP PHONET IEEE802154 IEEE802154_SOCKET \
            IEEE802154_6LOWPAN IEEE802154_DRIVERS WIREGUARD MACSEC \
            CC_OPTIMIZE_FOR_PERFORMANCE; do
            ./scripts/config --file out_resukisu/.config -d "$sym" || true
          done
          ./scripts/config --file out_resukisu/.config -e CC_OPTIMIZE_FOR_SIZE || true

          # Optional documented manual-hook helpers. Unknown symbols are dropped by olddefconfig.
          ./scripts/config --file out_resukisu/.config -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK || true
          ./scripts/config --file out_resukisu/.config -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK || true
          ./scripts/config --file out_resukisu/.config -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK || true

          cp out_resukisu/.config /tmp/cfg_round3_pre_olddefconfig
          make O=out_resukisu olddefconfig
          echo "===== CASCATA olddefconfig (o que os -d acima desligaram) ====="
          diff /tmp/cfg_round3_pre_olddefconfig out_resukisu/.config | head -100 || true

          echo "===== CONFIG CHECK ====="
          grep -Ei "LOCALVERSION|KSU|KERNELSU|RESUKISU|KSU_MANUAL_HOOK|MODULE_SIG_PROTECT|CONFIG_UH|CONFIG_RKP|CONFIG_KDP|CONFIG_SECURITY_DEFEX|CONFIG_SVSMC|CONFIG_SAMSUNG_PRODUCT_SHIP|KALLSYMS|CONFIG_FTRACE|CONFIG_KVM|CONFIG_VIRTUALIZATION|CC_OPTIMIZE|CONFIG_KASAN|CONFIG_UBSAN" out_resukisu/.config || true

          echo "===== SAMSUNG BLOCKER STRICT CHECK ====="
          BAD=0
          for sym in \
            CONFIG_MODULE_SIG_PROTECT \
            CONFIG_UH \
            CONFIG_RKP \
            CONFIG_KDP \
            CONFIG_SECURITY_DEFEX \
            CONFIG_SVSMC \
            CONFIG_SAMSUNG_PRODUCT_SHIP
          do
            if grep -q "^${sym}=y" out_resukisu/.config; then
              echo "ERROR: $sym is still enabled"
              BAD=1
            fi
          done

          if [ "$BAD" = "1" ]; then
            echo "Samsung blocker config still enabled. Stop build."
            exit 1
          fi

          make O=out_resukisu -j"$(nproc)"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp out_resukisu/arch/arm64/boot/Image "$GITHUB_WORKSPACE/dist/Image-ReSukiSU-R920"
          cp out_resukisu/.config "$GITHUB_WORKSPACE/dist/resukisu.config"

          echo "===== BUILT KERNEL IMAGE ====="
          ls -lh "$GITHUB_WORKSPACE/dist/Image-ReSukiSU-R920"
          IMGSZ=$(stat -c%s "$GITHUB_WORKSPACE/dist/Image-ReSukiSU-R920")
          echo "===== TOP SIMBOLOS (vmlinux) ====="
          ls -lh out_resukisu/vmlinux
          llvm-nm -S --size-sort out_resukisu/vmlinux 2>/dev/null | tail -30 || true
          echo "Image bytes: $IMGSZ (budget ~28516000 with stock ramdisk+dtb)"
          if [ "$IMGSZ" -ge 28516000 ]; then
            echo "ERROR: kernel Image $IMGSZ bytes exceeds the R920 boot budget (~28.5 MB)."
            echo "Slim the config (DEBUG_INFO off, fewer drivers) and rebuild."
            exit 1
          fi

      - name: Prepare stock firmware images
        run: |
          set -e

          mkdir -p work/firmware

          normalize_img() {
            name="$1"

            if [ -f "firmware/${name}.img" ]; then
              cp "firmware/${name}.img" "work/firmware/${name}.img"
              return 0
            fi

            if [ -f "firmware/${name}.img.lz4" ]; then
              lz4 -d -f "firmware/${name}.img.lz4" "work/firmware/${name}.img"
              return 0
            fi

            echo "Missing ${name}.img or ${name}.img.lz4"
            exit 1
          }

          normalize_img boot
          normalize_img vbmeta

          echo "===== NORMALIZED FIRMWARE IMAGES ====="
          ls -lh work/firmware

      - name: Download avbtool
        run: |
          set -e

          echo "===== Download avbtool with retries/fallbacks ====="

          if [ -f "tools/avbtool.py" ]; then
            echo "Using repo-local tools/avbtool.py"
            cp tools/avbtool.py avbtool.py
          else
            mkdir -p tools

            rm -f avbtool.py avbtool.py.b64

            echo "Trying official AOSP googlesource copy..."
            for attempt in 1 2 3 4 5 6 7; do
              echo "Attempt ${attempt}"
              if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
                -o avbtool.py.b64 \
                "https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT"; then
                if base64 -d avbtool.py.b64 > avbtool.py 2>/dev/null && [ -s avbtool.py ]; then
                  echo "Downloaded avbtool.py from googlesource"
                  break
                fi
              fi
              sleep 5
            done

            if [ ! -s avbtool.py ]; then
              echo "Googlesource failed. Trying GitHub raw mirror..."
              curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 \
                -o avbtool.py \
                https://raw.githubusercontent.com/aosp-mirror/platform_external_avb/master/avbtool.py
            fi

            if [ ! -s avbtool.py ]; then
              echo "Raw mirror failed. Cloning GitHub mirror..."
              git clone --depth=1 https://github.com/aosp-mirror/platform_external_avb.git tools/platform_external_avb
              cp tools/platform_external_avb/avbtool.py avbtool.py
            fi
          fi

          chmod +x avbtool.py

          echo "===== avbtool check ====="
          python3 avbtool.py --help >/dev/null
          python3 avbtool.py --version || true
          echo "avbtool OK"

      - name: Repack boot.img with ReSukiSU Image (header v2, SM-R920)
        run: |
          set -e

          cat > repack_boot_v2_r920.py <<'PY'
          import struct
          from pathlib import Path

          PART_SIZE = 37748736  # mmcblk0p18, 36864 KiB
          stock_path = Path("work/firmware/boot.img")
          kernel_path = Path("dist/Image-ReSukiSU-R920")
          out_path = Path("work/firmware/boot_resukisu_noavb.img")

          stock = stock_path.read_bytes()
          kernel = kernel_path.read_bytes()

          if stock[:8] != b"ANDROID!":
              raise SystemExit("stock boot.img is not an Android boot image")

          u4 = lambda o: struct.unpack("<I", stock[o:o+4])[0]
          page = u4(36)
          hdr_ver = u4(40)
          if hdr_ver != 2 or page != 2048:
              raise SystemExit(f"unexpected header: version={hdr_ver} page={page} (R920 stock is v2/2048)")

          ks, rs, ss = u4(8), u4(16), u4(24)
          dtb_size = u4(1648)

          def padn(n):
              return (n + page - 1) // page * page

          off = page
          k_off, k_end = off, off + padn(ks); off = k_end
          r_off, r_end = off, off + padn(rs); off = r_end
          s_off, s_end = off, off + padn(ss); off = s_end
          d_off, d_end = off, off + dtb_size

          ramdisk = stock[r_off:r_off + rs]
          dtb = stock[d_off:d_off + dtb_size] if dtb_size else b""
          header = bytearray(stock[:page])

          struct.pack_into("<I", header, 8, len(kernel))
          # kernel_addr/ramdisk/second/tags/page/version/os/name/cmdline/id/extra/dtb fields unchanged

          img = bytes(header)
          img += kernel
          img += b"\x00" * (padn(len(kernel)) - len(kernel))
          img += ramdisk
          img += b"\x00" * (padn(rs) - rs)
          img += dtb
          img += b"SEANDROIDENFORCE"
          img += b"\x00" * (padn(len(img)) - len(img))

          print("Old kernel:", ks, "New kernel:", len(kernel))
          print("Ramdisk:", rs, "DTB:", dtb_size)
          print("Repacked size:", len(img), "Partition:", PART_SIZE)

          if len(img) + 4096 >= PART_SIZE:
              raise SystemExit(f"New boot image too large: {len(img)} (partition {PART_SIZE}). Slim the kernel (disable DEBUG_INFO).")

          out_path.write_bytes(img)
          print("Wrote:", out_path)
          PY

          python3 repack_boot_v2_r920.py

      - name: Generate local AVB key and re-footer boot
        run: |
          set -e

          mkdir -p avb_keys

          openssl genrsa -out avb_keys/r920_local_avb.pem 4096

          cp work/firmware/boot_resukisu_noavb.img work/firmware/boot.img

          echo "===== Re-footer boot.img with local AVB key rollback index 0 ====="
          python3 avbtool.py erase_footer --image work/firmware/boot.img || true

          python3 avbtool.py add_hash_footer \
            --image work/firmware/boot.img \
            --partition_name boot \
            --partition_size 37748736 \
            --algorithm SHA256_RSA4096 \
            --key avb_keys/r920_local_avb.pem \
            --rollback_index 0

          echo "===== boot AVB info ====="
          python3 avbtool.py info_image --image work/firmware/boot.img || true

      - name: Generate new top-level vbmeta.img (SM-R920, no init_boot)
        run: |
          set -e

          python3 avbtool.py make_vbmeta_image \
            --output work/firmware/vbmeta.img \
            --algorithm SHA256_RSA4096 \
            --key avb_keys/r920_local_avb.pem \
            --rollback_index 0 \
            --flags 3 \
            --prop com.android.build.boot.os_version:16 \
            --prop com.android.build.boot.security_patch:2026-05-05 \
            --include_descriptors_from_image work/firmware/boot.img

          echo "===== New vbmeta info ====="
          python3 avbtool.py info_image --image work/firmware/vbmeta.img

      - name: "Build plain POSIX Odin/NetOdin AP tar (SM-R920 boot+vbmeta only)"
        run: |
          set -e

          mkdir -p final_ap

          cp work/firmware/boot.img final_ap/boot.img
          cp work/firmware/vbmeta.img final_ap/vbmeta.img

          tar --format=posix -cf dist/R920_ReSukiSU_AP.tar -C final_ap boot.img vbmeta.img

          cp dist/R920_ReSukiSU_AP.tar dist/R920_ReSukiSU_AP.tar.md5
          md5sum dist/R920_ReSukiSU_AP.tar >> dist/R920_ReSukiSU_AP.tar.md5

          sha256sum \
            dist/Image-ReSukiSU-R920 \
            dist/resukisu.config \
            dist/R920_ReSukiSU_AP.tar \
            dist/R920_ReSukiSU_AP.tar.md5 \
            > dist/SHA256SUMS.txt

          cat > dist/RELEASE_NOTES.txt <<'EOF'
          SM-R920 Galaxy Watch5 (Pro) ReSukiSU AP

          Target firmware:
          - R920XXS2DZE1 (ZTO)
          - Android 16
          - Security patch 2026-05-05
          - Rollback index 0

          Package contents (SM-R920 has NO init_boot partition):
          - boot.img (header v2, kernel replaced, ramdisk+dtb stock)
          - vbmeta.img (local key, flags 3)

          Included:
          - ReSukiSU setup.sh integration
          - CONFIG_KSU=y
          - CONFIG_KSU_MANUAL_HOOK=y
          - documented manual hooks for stat, execve/execveat, faccessat, reboot
          - best-effort optional hooks
          - Samsung blocker configs disabled if present
          - locally signed AVB footer and vbmeta flags 3

          Flash only after bootloader unlock, with cradle USB + Odin/NetOdin.
          This AP tar is for SM-R920 R920XXS2DZE1 only. NEVER flash on SM-R960.
          EOF

          echo "===== DIST FILES ====="
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r920-resukisu-ap-${{ github.run_number }}
          name: SM-R920 ReSukiSU AP ${{ github.run_number }}
          body_path: dist/RELEASE_NOTES.txt
          files: |
            dist/R920_ReSukiSU_AP.tar
            dist/R920_ReSukiSU_AP.tar.md5
            dist/Image-ReSukiSU-R920
            dist/resukisu.config
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.txt
